# Applause CI Workflow — id:default name:"Default"
# Generated by Applause AI Automation — do not edit by hand.
# Re-synced on every "Sync to GitHub". Runs the committed Playwright project.
name: Default

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite tag to run (Playwright --grep @<suite>)
        type: string
        default: swag-labs
      browser:
        description: Browser project to run (must be enabled in customer.config browsers)
        type: choice
        options:
          - desktop-chrome
          - desktop-firefox
          - desktop-webkit
        default: desktop-chrome
      env_profile:
        description: Env profile to run against (project Env Vars tab)
        type: choice
        options:
          - test
          - default
        default: test

jobs:
  test:
    # inputs.* is only populated on a workflow_dispatch trigger — a schedule-
    # triggered run has no inputs at all, so every reference below falls back
    # to the configured defaults via `||` rather than resolving to empty.
    name: Playwright (${{ inputs.browser || 'desktop-chrome' }} / ${{ inputs.env_profile || 'test' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.env_profile || 'test' }}
    env:
      RUN_SUITE: ${{ inputs.suite || 'swag-labs' }}
      RUN_BROWSER: ${{ inputs.browser || 'desktop-chrome' }}
      CI: 'true'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      GMAIL_IMAP_USER: ${{ secrets.GMAIL_IMAP_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
      MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
      URL: ${{ vars.URL }}
      TEST_USERNAME: ${{ vars.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Plain install: the generated project ships no lockfile (the framework's
      # pnpm-lock.yaml doesn't match the trimmed dependencies).
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run suite
        run: |
          if [[ "$RUN_BROWSER" == bstack:* ]]; then
            echo "BrowserStack CI execution is not yet wired up — this target requires the desktop app's own execution engine. Skipping." >&2
            exit 1
          fi

          if [[ "$RUN_BROWSER" == mobile:* ]]; then
            echo "Mobile CI execution is not yet wired up — mobile/native-app suites run via Appium against a local device or BrowserStack App Automate, not a GitHub Actions runner. Skipping." >&2
            exit 1
          fi
          npx playwright test --grep "@$RUN_SUITE" --project="$RUN_BROWSER" --workers=1 --reporter=line,allure-playwright
      - name: Generate Allure HTML report
        if: ${{ !cancelled() }}
        run: npx allure-commandline generate ./allure-results -o ./allure-report --single-file
      - name: Upload Allure HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ env.RUN_SUITE }}
          path: allure-report/
          retention-days: 30
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ env.RUN_SUITE }}
          path: allure-results/
          retention-days: 30
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.RUN_SUITE }}
          path: playwright-report/
          retention-days: 30
      - name: Upload traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ env.RUN_SUITE }}
          path: test-results/
          retention-days: 30
